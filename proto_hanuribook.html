<script>
const FILES = {"Advanced": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; display: flex; flex-direction: column\">\n  <dc-import name=\"Header\" active=\"program\" sub=\"초등심화\" crumbs=\"프로그램 &gt; 초등심화\" hint-size=\"100%,260px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"a-h\" class=\"wrap\" style=\"padding-top: 28px; display: flex; flex-direction: column; gap: 8px\">\n      \n      <h1 id=\"a-h\" class=\"sec-h\" style=\"margin: 0; font-size: 24px; font-weight: 800; line-height: 1.35\">정규 수업에 더하는<br>교과 배경지식 심화 과정<\/h1>\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.7; color: #4A4A4A\">과학·역사·지리 분야의 책을 깊이 읽고 탐구하며, 교과서 너머의 배경지식과 융합적 사고력을 키웁니다.<\/p>\n    <\/section>\n\n    <section aria-label=\"초등심화 과정\" class=\"wrap\" style=\"padding-top: 20px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 16px\">\n      <ul class=\"split\" style=\"margin: 0; padding: 0; list-style: none; gap: 12px\">\n        <sc-for list=\"{{tabs}}\" as=\"c\" hint-placeholder-count=\"4\">\n          <li style=\"display: flex\">\n            <article style=\"flex: 1 1 auto; border-radius: 20px; overflow: hidden; background: #FFFFFF; border: 1px solid #EEEEEE\">\n              <div style=\"position: relative; height: 120px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5A4A3C; text-align: center\">[이미지] {{c.img}}<span style=\"position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 14px; border-radius: 999px; background: {{c.badge}}; color: #FFFFFF; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center\">{{c.grade}}<\/span><\/div>\n              <div style=\"padding: 16px; display: flex; flex-direction: column; gap: 6px\">\n                <h2 style=\"margin: 0; font-size: 19px; font-weight: 800\">{{c.label}}<\/h2>\n                <p style=\"margin: 0; font-size: 14px; font-weight: 600; color: #333333\">{{c.slogan}}<\/p>\n                <p style=\"margin: 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">{{c.desc}}<\/p>\n              <\/div>\n            <\/article>\n          <\/li>\n        <\/sc-for>\n      <\/ul>\n    <\/section>\n  <\/main>\n  <dc-import name=\"Footer\" hint-size=\"100%,340px\"><\/dc-import>\n  <div class=\"sticky-b\"><dc-import name=\"BottomNav\" cta=\"초등심화 무료체험·상담신청\" cta-href=\"Consult.dc.html\" hint-size=\"100%,84px\"><\/dc-import><\/div>\n<\/div>\n", "css": "\n\nbody{margin:0;background:#FFFFFF}\na{color:#C2410C}a:hover{color:#9A3412}\n.wrap{max-width:1200px;margin:0 auto;padding-left:20px;padding-right:20px;box-sizing:border-box}\n.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}\n.g-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.g-all{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.sticky-b{position:sticky;bottom:0;z-index:20}\n@media (min-width:768px){.g-steps{grid-template-columns:repeat(4,minmax(0,1fr))}.g-all{grid-template-columns:repeat(4,minmax(0,1fr))}}\n@media (min-width:1024px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}.sec-h{font-size:30px !important}}\n", "code": "\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { sel: 'sci' }; }\n  renderVals() {\n    const defs = [\n      { id: 'sci', label: '과학탐탐', grade: '초등 3학년', tint: '#E6F4EA', badge: '#1F7A4C', img: '실험 관찰 노트를 쓰는 아이', short: '과학 도서 탐구와 실험 관찰 글쓰기',\n        slogan: '궁금증을 탐구로, 탐구를 글로', desc: '과학 교과와 연계된 도서를 읽고 관찰·실험 활동을 통해 원리를 이해한 뒤, 탐구 보고서와 설명문으로 정리합니다.',\n        points: ['교과서 핵심 과학 개념을 책으로 먼저 이해', '관찰·실험 과정을 논리적인 글로 표현', '과학 관련 시사 이슈 토론'], steps: ['개념 도서 읽기', '탐구 활동', '실험 관찰 기록', '탐구 보고서 쓰기'] },\n      { id: 'kh', label: '한국사', grade: '초등 4학년', tint: '#FFF1E0', badge: '#B45309', img: '역사책과 유물 사진 카드', Border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: {{centerFg}}; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap\">\n      <svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"3\"><\/circle><\/svg>\n      센터찾기\n    <\/a>\n    <a href=\"{{ctaHref}}\" style=\"height: 56px; border-radius: 14px; background: {{accentFill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap\">\n      <svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h10M4 11h7M4 16h5\"><\/path><path d=\"m14 18 1-3.5 5.5-5.5a1.6 1.6 0 0 1 2.3 2.3L17.3 17l-3.3 1z\"><\/path><\/svg>\n      상담 신청하기\n    <\/a>\n  <\/nav>\n<\/div>\n", "css": "\n\nbody{margin:0}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    const on = this.props.centerActive ?? false;\n    const pink = (this.props.theme ?? 'orange') === 'pink';\n    const fill = pink ? '#D63F7C' : '#F26522';\n    const text = pink ? '#B8326A' : '#C2410C';\n    return {\n      accentFill: fill,\n      ctaHref: this.props.ctaHref ?? 'Consult.dc.html',\n      centerBg: on ? '#FFFFFF' : '#F4F4F5',\n      centerFg: on ? text : '#333333',\n      centerBorder: on ? '1.5px solid ' + fill : '1.5px solid #F4F4F5'\n    };\n  }\n}\n"}, "Centers": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; display: flex; flex-direction: column\">\n  <dc-import name=\"Header\" active=\"center\" sub=\"\" crumbs=\"센터찾기\" hint-size=\"100%,150px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"ct-h\" class=\"wrap\" style=\"padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n      <h1 id=\"ct-h\" class=\"hero-h\" style=\"margin: 0; font-size: 26px; font-weight: 800\">전국 한우리 센터 찾기<\/h1>\n      <p style=\"margin: -4px 0 4px; font-size: 15px; line-height: 1.6; color: #4A4A4A\">전국 <strong style=\"color: #C2410C\">600개<\/strong> 센터에서 <strong style=\"color: #C2410C\">4,500명<\/strong>의 한우리 선생님이 우리 아이를 기다리고 있습니다.<\/p>\n      <div style=\"position: relative\">\n        <label for=\"ct-q\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">센터 검색<\/label>\n        <svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6B6B6B\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"position: absolute; left: 16px; top: 16px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m21 21-4.3-4.3\"><\/path><\/svg>\n        <input id=\"ct-q\" type=\"search\" placeholder=\"지점명, 지역명, 지하철역으로 검색\" style=\"width: 100%; box-sizing: border-box; height: 52px; border-radius: 14px; border: 1px solid #E4E4E4; background: #FFFFFF; padding: 0 16px 0 46px; font-family: inherit; font-size: 16px; color: #1F1F1F\">\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n        <label style=\"display: block\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">시/도<\/span><select style=\"width: 100%; height: 48px; border-radius: 12px; border: 1px solid #E4E4E4; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1F1F1F\"><option>서울특별시<\/option><option>경기도<\/option><\/select><\/label>\n        <label style=\"display: block\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">구/군<\/span><select style=\"width: 100%; height: 48px; border-radius: 12px; border: 1px solid #E4E4E4; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1F1F1F\"><option>서초구<\/option><option>강남구<\/option><option>마포구<\/option><\/select><\/label>\n      <\/div>\n      <div style=\"display: flex; justify-content: space-between; align-items: center; padding-top: 4px\">\n        <p style=\"margin: 0; font-size: 14px; color: #4A4A4A\" aria-live=\"polite\">인근 탐색 결과 <strong style=\"color: #C2410C\">{{count}}곳<\/strong><\/p>\n        <div role=\"group\" aria-label=\"보기 방식\" style=\"display: flex; padding: 3px; border-radius: 10px; background: #F1F1F2\">\n          <button aria-pressed=\"{{mapSel}}\" onClick=\"{{showMap}}\" style=\"height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: {{mapBg}}; color: #1F1F1F; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">지도<\/button>\n          <button aria-pressed=\"{{listSel}}\" onClick=\"{{showList}}\" style=\"height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: {{listBg}}; color: #1F1F1F; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">목록<\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <div class=\"wrap cmain\" style=\"padding-top: 14px; padding-bottom: 48px\">\n      <sc-if value=\"{{isMap}}\" hint-placeholder-val=\"{{true}}\">\n        <div id=\"ct-map\" class=\"mapbox\" role=\"img\" aria-label=\"서울 주요 한우리 센터 위치 지도\" style=\"position: relative; border-radius: 20px; overflow: hidden; background: #F1F3F0; border: 1px solid #E6E6E6\">\n          <svg aria-hidden=\"true\" viewBox=\"0 0 400 300\" preserveAspectRatio=\"xMidYMid slice\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\">\n            <path d=\"M-10 150 C60 120 110 170 170 140 S280 90 330 120 S400 110 420 100 L420 130 C380 140 340 150 300 145 S200 1  - 20:30 (일요일 휴무)', extra: '초등 독서력 평가실 & 중등 토론룸 구비', tags: ['near'] },\n      { name: '한우리 분당정자센터', dist: '경기 성남', sub: '정자역 3번 출구', badges: [{ t: '우수 러닝센터', ...O }, { t: '체험수업 가능', ...T }], addr: '경기 성남시 분당구 성남대로 385 분당클리닉빌딩 3층', hours: '화~토 09:30 - 18:30', extra: '지하 주차장 완비 (방문 등록 시 90분 무료)', tags: ['parking', 'trial'] },\n      { name: '한우리 마포공덕센터', dist: '서울 마포', sub: '공덕역 1번 출구', badges: [{ t: '유아/초등 독서코칭', ...B }, { t: '소그룹 토론', ...G }], addr: '서울 마포구 백범로 170 공덕더샵 상가동 2층', hours: '월~금 11:00 - 19:30 / 토 09:30 - 15:00', extra: '유아 전용 독서 코칭실 운영', tags: ['small', 'trial'] }\n    ];\n    const fdefs = [['near', '◎ 내 주변 센터'], ['parking', 'P 주차 가능'], ['trial', '체험수업 가능'], ['small', '소그룹 수업']];\n    const fs = this.state.f;\n    const filters = fdefs.map(([k, label]) => {\n      const on = !!fs[k];\n      return { label, sel: on ? 'true' : 'false', bg: on ? '#F26522' : '#FFFFFF', fg: on ? '#FFFFFF' : '#333333', border: on ? '1px solid #F26522' : '1px solid #E4E4E4', toggle: () => this.setState({ f: { ...fs, [k]: !on } }) };\n    });\n    const active = Object.keys(fs).filter(k => fs[k] && k !== 'near');\n    const centers = all.filter(c => active.every(k => c.tags.includes(k)));\n    const isMap = this.state.view === 'map';\n    return {\n      filters, centers, count: centers.length, isMap,\n      mapSel: isMap ? 'true' : 'false', listSel: isMap ? 'false' : 'true',\n      mapBg: isMap ? '#FFFFFF' : 'transparent', listBg: isMap ? 'transparent' : '#FFFFFF',\n      showMap: () => this.setState({ view: 'map' }), showList: () => this.setState({ view: 'list' })\n    };\n  }\n}\n"}, "Consult": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; display: flex; flex-direction: column\">\n  <dc-import name=\"Header\" active=\"consult\" sub=\"\" crumbs=\"수업상담\" hint-size=\"100%,150px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto; background: #FFFAF7\">\n    <section aria-labelledby=\"c-h\" style=\"background: #FFFFFF\">\n      <div class=\"wrap\" style=\"padding-top: 32px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 12px\">\n        <h1 id=\"c-h\" class=\"hero-h\" style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.35\">우리 아이 <span style=\"color: #D94E0F\">문해력<\/span><br>한우리와 상담하세요!<\/h1>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4A4A4A\">30년 독서 전문 교육 노하우로 아이의 독서력 수준을 진단하고 딱 맞는 커리큘럼을 안내해 드립니다.<\/p>\n        <ol aria-label=\"신청 단계\" style=\"margin: 8px 0 0; padding: 12px 14px; list-style: none; border-radius: 16px; background: #F7F7F8; display: flex; align-items: center; gap: 8px; font-size: 14px\">\n          <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"3\">\n            <li style=\"display: flex; align-items: center; gap: 6px; flex: {{s.flex}}\">\n              <span style=\"width: 24px; height: 24px; flex: 0 0 auto; border-radius: 50%; background: {{s.bg}}; color: {{s.fg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{s.n}}<\/span>\n              <span style=\"font-weight: {{s.weight}}; color: {{s.color}}; white-space: nowrap\">{{s.label}}<\/span>\n              <sc-if value=\"{{s.line}}\" hint-placeholder-val=\"{{true}}\"><span aria-hidden=\"true\" style=\"flex: 1 1 auto; height: 2px; min-width: 12px; background: #E0E0E0\"><\/span><\/sc-if>\n            <\/li>\n          <\/sc-for>\n        <\/ol>\n      <\/div>\n    <\/section>\n\n    <div class=\"wrap layout\" style=\"padding-top: 20px; padding-bottom: 40px\">\n      <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\">\n        <section aria-live=\"polite\" style=\"padding: 36px 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EEEEEE; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center\">\n          <span style=\"width: 64px; height: 64px; border-radius: 50%; back 수)<\/span><\/span><span style=\"font-size: 13px; color: #6B6B6B\">택 1<\/span><\/legend>\n          <p style=\"margin: 0; font-size: 14px; color: #4A4A4A\">정확한 연령별 진단 도서 선정을 위해 필요합니다.<\/p>\n          <div class=\"g-grade\" role=\"radiogroup\" aria-label=\"자녀 학년\">\n            <sc-for list=\"{{grades}}\" as=\"g\" hint-placeholder-count=\"6\">\n              <button type=\"button\" role=\"radio\" aria-checked=\"{{g.sel}}\" onClick=\"{{g.pick}}\" style=\"height: 52px; border-radius: 14px; border: {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; font-family: inherit; font-size: 15px; font-weight: {{g.weight}}; cursor: pointer\">{{g.label}}<\/button>\n            <\/sc-for>\n          <\/div>\n        <\/fieldset>\n\n        <fieldset style=\"margin: 0; padding: 22px 20px; border: 1px solid #EEEEEE; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px\">\n          <legend style=\"float: left; width: 100%; padding: 0; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #F26522\"><\/span>보호자 연락처 정보 <span style=\"font-size: 13px; font-weight: 600; color: #C2410C\">(필수)<\/span><\/legend>\n          <p style=\"margin: 0; font-size: 14px; color: #4A4A4A\">가까운 지역 센터 또는 전담 지도교사가 배정됩니다.<\/p>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"c-name\" style=\"font-size: 13px; font-weight: 600; color: #333333\">보호자 성함<\/label>\n            <input id=\"c-name\" type=\"text\" autocomplete=\"name\" placeholder=\"예: 김민서\" style=\"height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #F7F7F8; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1F1F1F; box-sizing: border-box; width: 100%\">\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"c-phone\" style=\"font-size: 13px; font-weight: 600; color: #333333\">휴대폰 번호<\/label>\n            <input id=\"c-phone\" type=\"tel\" autocomplete=\"tel\" inputmode=\"numeric\" placeholder=\"010-1234-5678\" style=\"height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #F7F7F8; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1F1F1F; box-sizing: border-box; width: 100%\">\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <span style=\"font-size: 13px; font-weight: 600; color: #333333\">거주 지역 (가까운 지점 연결)<\/span>\n            <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n              <label style=\"display: block\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">시/도<\/span><select style=\"width: 100%; height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1F1F1F\"><option>경기도<\/option><option>서울특별시<\/option><option>인천광역시<\/option><\/select><\/label>\n              <label style=\"display: block\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">시/군/구<\/span><select style=\"width: 100%; height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1F1F1F\"><option>성남시 분당구<\/option><option>성남시 수정구<\/option><option>용인시 수지구<\/option><\/select><\/label>\n            <\/div>\n          <\/div>\n          <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: #F7F7F8; cursor: pointer\">\n            <input type=\"checkbox\" checked=\"{{agree}}\" onChange=\"{{toggleAgree}}\" style=\"width: 22px; height: 22px; margin: 1px 0 0; accent-color: #F26522; flex: 0 0 auto\">\n            <span style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 14px; font-weight: 600; line-height: 1.5\">[필수] 개인정보 수집 및 상담 안내를 위한 연락에 동의합니다.<\/span><span style=\"font-size: 12px; line-height: 1.5; color: #6B6B6B\">수집 목적: 무료 진단 및 독서 상담 안내 / 보유 기간: 상담 종료 후 즉시 파기<\/span><\/span>\n          <\/label>\n          <p style=\"margin: 0; padding: 14px 16px; border-radius: 14px; background: #EAF2FF; color: #2A4A80; font-size: 13px; line-height: 1.5; display: flex; gap: 10px; align-items: center\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#2F5AA8\" style=\"flex: 0 0 auto\"><path d=\"M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z\"><\/path><path d=\"m9 12 2 2 4-4\" stroke=\"#FFFFFF\" stroke-width=\"2\" fill=\"none\"><\/path><\/svg>신청 완료 후 24시간 이내에 담당 전문 지도교사가 먼저 친절히 전화 드립니다.<\/p>\n          <button type=\"button\" onClick=\"{{submit}}\" style=\"height: 56px; border: 0; border-radius: 14px; background: #F26522; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">무료 상담 신청 완료하기 →<\/button>\n        <\/fieldset>\n      <\/form>\n      <\/sc-if>\n\n      <aside aria-labelledby=\"faq-h\" style=\"padding: 22px 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 12px\">\n        <h2 id=\"faq-h\" style=\"margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D94E0F\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01\"><\/path><\/svg>신청 전 자주 묻는 질문<\/h2>\n        <sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"border-radius: 16px; background: #F7F7F8\">\n            <button type=\"button\" aria-expanded=\"{{f.exp}}\" onClick=\"{{f.toggle}}\" style=\"width: 100%; min-height: 52px; padding: 14px 16px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: #1F1F1F; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer\">Q. {{f.q}}<span aria-hidden=\"true\" style=\"color: #6B6B6B\">{{f.icon}}<\/span><\/button>\n            <sc-if value=\"{{f.open}}\" hint-placeholder-val=\"{{true}}\"><p style=\"margin: 0; padding: 0 16px 16px; font-size: 14px; line-height: 1.7; color: #4A4A4A\">{{f.a}}<\/p><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/aside>\n    <\/div>\n  <\/main>\n  <dc-import name=\"Footer\" hint-size=\"100%,340px\"><\/dc-import>\n  <div class=\"sticky-b\"><dc-import name=\"BottomNav\" cta=\"무료 상담 신청 완료하기\" cta-href=\"Consult.dc.html\" show-center=\"{{false}}\" hint-size=\"100%,84px\"><\/dc-import><\/div>\n<\/div>\n", "css": "\n\nbody{margin:0;background:#FFFFFF}\na{color:#C2410C}a:hover{color:#9A3412}\ninput::placeholder{color:#8A8A8A}\n.wrap{max-width:1200px;margin:0 auto;padding-left:20px;padding-right:20px;box-sizing:border-box}\n.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}\n.g-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.sticky-b{position:sticky;bottom:0;z-index:20}\n@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}.hero-h{font-size:36px !important}}\n", "code": "\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { grade: '초등 1~2학년', agree: true, open: { 0: true, 1: true } }; }\n  renderVals() {\n    const list = ['유아 6~7세', '초등 1~2학년', '초등 3~4학년', '초등 5~6학년', '중학생', '고등학생'];\n    const grades = list.map(label => {\n      const on = label === this.state.grade;\n      return { label, sel: on ? 'true' : 'false', bg: on ? '#F26522' : '#F4F4F5', fg: on ? '#FFFFFF' : '#333333', border: on ? '2px solid #F26522' : '2px solid transparent', weight: on ? 700 : 500, pick: () => this.setState({ grade: label }) };\n    });\n    const stepDefs = ['자녀 정보', '학습 관심사', '신청 정보'];\n    const steps = stepDefs.map((label, i) => ({ n: i + 1, label, line: i < 2, flex: i < 2 ? '1 1 auto' : '0 0 auto', bg: i === 0 ? '#F26522' : '#E4E4E4', fg: i === 0 ? '#FFFFFF' : '#4A4A4A', weight: i === 0 ? 700 : 500, color: i === 0 ? '#1F1F1F' : '#6B6B6B' }));\n    const faqDefs = [\n      { q: '상담 신청하면 바로 결제되나요?', a: '아닙니다! 전화 상담과 방문 진단은 전액 무료이며, 실제 수업 진행 여부는 상담 후 자녀와 편안하게 상의하여 결정하실 수 있습니다.' },\n      { q: '독서 진단 테스트는 어떻게 진행되나요?', a: '자녀의 학년별 어휘 이해도 및 지문 독해 성향을 전문 분석 도구로 측정하며, 약 15~20분간 간이 문해력 평가 후 결과표를 전달드립니다.' },\n      { q: '수업은 어디에서 받나요?', a: '방문 수업, 홈클럽 수업, 학원 수업 중 아이의 상황에 맞는 방식을 상담 시 함께 정합니다.' }\n    ];\n    const faqs = faqDefs.map((f, i) => {\n      const open = !!this.state.open[i];\n      return { ...f, open, exp: open ? 'true' : 'false', icon: open ? '−' : '+', toggle: () => this.setState({ open: { ...this.state.open, [i]: !open } }) };\n    });\n    const done = !!this.state.done;\n    return { done, notDone: !done, grade: this.state.grade, submit: () => this.setState({ done: true }), grades, steps, faqs, agree: this.state.agree, toggleAgree: () => this.setState({ agree: !this.state.agree }) };\n  }\n}\n"}, "CourseHub": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; display: flex; flex-direction: column; --ac: {{c.ac}}; --ac-text: {{c.text}}; --ac-soft: {{c.soft}}; --ac-line: {{c.line}}\">\n  <dc-import name=\"Header\" active=\"program\" sub=\"{{g.sub}}\" crumbs=\"{{g.crumbs}}\" hint-size=\"100%,260px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"hub-h\" style=\"background: var(--ac-soft); border-bottom: 1px solid var(--ac-line)\">\n      <div class=\"wrap\" style=\"padding-top: 32px; padding-bottom: 32px; display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid var(--ac-line); color: var(--ac-text); font-size: 13px; font-weight: 700\">{{g.eyebrow}}<\/span>\n        <h1 id=\"hub-h\" class=\"hub-h\" style=\"margin: 0; font-size: 26px; font-weight: 800; line-height: 1.35; letter-spacing: -0.04em; white-space: pre-line\">{{g.title}}<\/h1>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #4A4A4A; max-width: 640px\">{{g.desc}}<\/p>\n      <\/div>\n    <\/section>\n\n    <section aria-labelledby=\"hub-road\" class=\"wrap\" style=\"padding-top: 40px; display: flex; flex-direction: column; gap: 18px\">\n      <h2 id=\"hub-road\" class=\"sec-h\" style=\"margin: 0; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: var(--ac)\"><\/span>단계별 커리큘럼<\/h2>\n      <ol class=\"road\" style=\"--n: {{n}}\">\n        <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"3\">\n          <li class=\"step\" style=\"--i: {{s.lift}}\">\n            <span class=\"step-no\" style=\"align-self: flex-start; margin-bottom: 8px; padding: 3px 9px; border-radius: 999px; background: var(--ac); color: #FFFFFF; font-size: 11px; font-weight: 800; letter-spacing: 0.04em\">STEP {{s.no}}<\/span>\n            <p style=\"margin: 0; font-size: 13px; font-weight: 700; color: var(--ac-text)\">{{s.eyebrow}}<\/p>\n            <h3 style=\"margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--ac-text)\">{{s.title}}<\/h3>\n            <div class=\"step-line\" aria-hidden=\"true\"><\/div>\n            <div class=\"step-body\" style=\"margin-top: 10px\">\n              <p style=\"margin: 0; font-size: 15px; font-weight: 800; line-height: 1.5; color: var(--ac-text); white-space: pre-line\">{{s.head}}<\/p>\n              <ul style=\"margin: 0 0 6px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px\">\n                <sc-for list=\"{{s.items}}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <li style=\"display: flex; gap: 8px; font-size: 14px; line-height: 1.55; color: #4A4A4A; word-break: keep-all\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 4px; height: 4px; margin-top: 9px; border-radius: 50%; background: #8A8A8A\"><\/span>{{it}}<\/li>\n                <\/sc-for>\n              <\/ul>\n              <a class=\"step-go\" href=\"{{s.href}}\" aria-label=\"{{s.title}} 상세보기\" style=\"align-self: stretch; min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--ac); color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none\">바로가기<svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/a>\n            <\/div>\n          <\/li>\n        <\/sc-for>\n      <\/ol>\n      <p style=\"margin: 6px 0 0; height: 48px; border-radius: 999px; background: var(--ac); color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: -0.02em\">{{g.bar}}<\/p>\n    <\/section>\n\n    <section aria-labelledby=\"hub-feat\" class=\"wrap\" style=\"padding-top: 48px; display: flex; flex-direction: column; gap: 14px\">\n      <h2 id=\"hub-feat\" class=\"sec-h\" style=\"margin: 0; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: var(--ac)\"><\/span>프로그램의 특징<\/h2>\n      <ol class=\"g-feat\" style=\"margin: 0; padding: 0; list-style: none\">\n        <sc-for list=\"{{feats}}\" as=\"f\" hint-placeholder-count=\"4\">\n          <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: var(--ac); color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{f.n}}<\/span><div><strong style=\"font-size: 15px; word-break: keep-all\">{{f.t}}<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A; word-break: keep-all\">{{f.d}}<\/p><\/div><\/li>\n        <\/sc-for>\n      <\/ol>\n    <\/section>\n\n    <section aria-label=\"자가진단\" class=\"wrap\" style=\"padding-top: 32px; padding-bottom: 48px\">\n      <div style=\"display: flex; align-items: center; gap: 12px; padding: 18px; border-radius: 20px; background: #EAF2FF\">\n        <svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2F5AA8\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex: 0 0 auto\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01\"><\/path><\/svg>\n        <div style=\"flex: 1 1 auto\"><strong style=\"font-size: 15px\">우리 아이 단계가 고민되시나요?<\/strong><p style=\"margin: 2px 0 0; font-size: 13px; color: #33496B\">무료 독서성향 검사 및 맞춤 상담 가능<\/p><\/div>\n        <a href=\"Consult.dc.html\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; background: #1E3A5F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none; flex: 0 0 auto\">자가진단<\/a>\n      <\/div>\n    <\/section>\n  <\/main>\n  <dc-import name=\"Footer\" hint-size=\"100%,340px\"><\/dc-import>\n  <div class=\"sticky-b\"><dc-import name=\"BottomNav\" cta-href=\"Consult.dc.html\" hint-size=\"100%,84px\"><\/dc-import><\/div>\n<\/div>\n", "css": "\n\nbody{margin:0;background:#FFFFFF}\na{color:#C2410C}a:hover{color:#9A3412}\n.wrap{max-width:1200px;margin:0 auto;padding-left:20px;padding-right:20px;box-sizing:border-box}\n.sticky-b{position:sticky;bottom:0;z-index:20}\n.road{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}\n.step{position:relative;display:flex;flex-direction:column;background:var(--ac-soft);border:1px solid var(--ac-line);border-radius:20px;padding:20px}\n.step-line{display:none}\n.step-body{display:flex;flex-direction:column;gap:10px;flex:1 1 auto}\n.step-go{margin-top:auto}\n.g-feat{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}\n@media (min-width:768px){.g-feat{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (min-width:1024px){\n .hub-h{font-size:38px !important}\n .sec-h{font-size:28px !important}\n .g-feat{grid-template-columns:repeat(3,minmax(0,1fr))}\n .road{grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;align-items:stretch}\n .step{background:transparent;border:0;border-radius:0;padding:calc(var(--i) * 64px) 0 0 0}\n .step-no{display:none !important}\n .step-line{display:block;position:relative;height:2px;background:#BDBDBD;margin:14px 0 0}\n .step:not(:first-child) .step-line::before{content:\"\";position:absolute;left:0;top:0;width:2px;height:66px;background:#BDBDBD}\n .step:last-child .step-line::after{content:\"\";position:absolute;right:-2px;top:-5px;border-left:11px solid #BDBDBD;border-top:6px solid transparent;border-bottom:6px solid transparent}\n .step-body{border-left:1px dashed #D6D6D6;padding:16px 20px 4px 18px}\n .step:first-child .step-body{border-left-color:transparent;padding-left:0}\n}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    const palettes = {\n      elementary: { ac: '#D97706', text: '#A45207', soft: '#FFF8E6', line: '#F8E2B4' },\n      advanced: { ac: '#E2531D', text: '#B83C0B', soft: '#FFF2EC', line: '#F8D5C6' },\n      middle: { ac: '#2E9447', text: '#1E7334', soft: '#EEF8F1', line: '#CBE8D3' }\n    };\n    const groups = {\n      elementary: {\n        sub: '초등정규', crumbs: '프로그램 > 초등정규', eyebrow: '초등 1~6학년 · 정규 과정',\n        title: '학년별로 차근차근,\\n생각이 자라는 독서',\n        desc: '생각하는 나무 어휘리더부터 논리리더까지, 학년별 발달 단계에 맞춘 필독서와 교재로 어휘력부터 논리적 사고력까지 단계적으로 키웁니다.',\n        bar: '초등 정규 프로그램',\n        steps: [\n          { eyebrow: '생각하는 나무', title: '어휘리더 1, 2', href: 'DetailVocab.dc.html', head: '듣기·말하기·읽기·쓰기의 기초는 어휘력,\\n풍부한 어휘력 기르기',\n            items: ['여러 주제의 글을 읽고 다양한 독후 활동하기', '다양한 문학 작품을 감상하고 주제에 대해 자기 생각 표현하기', '교과 관련 도서를 읽고 배경지식 확장하기', '통합 주제를 탐색하고 자기 생각 발표하기'] },\n          { eyebrow: '생각하는 나무', title: '독서리더 1, 2', href: 'DetailReading.dc.html', head: '인성과 창의성의 출발점은 독서,\\n다양한 독서 경험 쌓기',\n            items: ['글의 특징과 구성을 이해하고 전략을 활용하여 과정 중심 읽기·쓰기', '다양한 문학 작품을 감상하고 주제에 대해 토의·토론하기', '교과 관련 도서를 읽고 배경지식 확장하기', '토의·토론의 형식을 익히며 주제에 대해 토의·토론하기'] },\n          { eyebrow: '생각하는 나무', title: '논리리더 1, 2', href: 'DetailLogic.dc.html', head: '융합적 사고력의 기본은 논리,\\n논리적으로 토론하고 논술하기',\n            items: ['읽기 전략을 활용하여 단편 도서를 읽고, 쓰기 전략을 활용하여 과정 중심 글쓰기', '문학 작품을 비판적으로 감상하고 주제와 관련하여 독서 토의·토론하기', '주어진 주제를 비판적으로 분석하고 통합적으로 사고하여 실전 토의·토론하기', '교과 관련 도서를 읽어 지식을 확장하고 비판적 사고력 기르기'] }\n        ],\n        feats: [\n          ['문해력 향상 훈련', '다양한 어휘, 문법, 요약하기, 속담, 한자성어 등 어린이들이 꼭 알아야 할 국어 지식 익히기 활동과 미시적 독해 전략 활용 활동을 합니다.'],\n          ['필독서를 통한 사고력 확장', '읽은 책을 바탕으로 사고를 확장하여 각각 글을 쓰고 토의·토론을 하며 주제에 대하여 더 깊이 생각해 보는 나선형 활동을 합니다.'],\n          ['사고력 발달을 위한 독서 토의·토론', '독서한 내용에 대해서 어린이들이 여러 가지 차원에서 생각이나 느낌, 의견을 나눔으로써 더욱 수준 높은 독서가 되도록 능동적 의사소통을 합니다.'],\n          ['문제 해결력을 기르는 자기주도학습', '어린이 스스로 문제의식을 갖고 책을 읽고 문제를 해결할 수 있도록 자기주도적 활동을 합니다.'],\n          ['멀티미디어 활용', 'QR 코드 등의 멀티미디어를 활용하여 흥미 있는 독서 토의·토론 활동을 합니다.'],\n          ['온라인 연계 활동', '어린이들이 읽는 필독서와 연계하여 책의 내용을 확인할 수 있는 독서 퀴즈를 매월 제공합니다.']\n        ]\n      },\n      advanced: {\n        sub: '초등심화', crumbs: '프로그램 > 초등심화', eyebrow: '초등 3~6학년 · 정규 심화 과정',\n        title: '정규 수업에 더하는\\n교과 배경지식 심화 과정',\n        desc: '과학 독서 프로그램 과학탐탐과 한우리 통합사회 1~3으로 과학·역사·지리·문화 분야의 배경지식과 올바른 가치관을 키웁니다.',\n        bar: '정규 심화 프로그램',\n        steps: [\n          { eyebrow: '과학 독서 프로그램', title: '과학탐탐', href: 'DetailScience.dc.html', head: '과학 기초 탐구 역량 기르기',\n            items: ['과학 기초 개념과 용어 이해', '문제 해결력과 과학 탐구력 향상', '초등 3학년 과학 교과 배경지식 확장'] },\n          { eyebrow: '한우리 통합사회 1', title: '똑똑한국사', href: 'DetailHistory.dc.html', head: '올바른 역사관 확립하기',\n            items: ['역사 개념과 흐름 이해', '재미있고 흥미로운 역사 토의·토론 활동', '초등 5~6학년 사회 교과 대비'] },\n          { eyebrow: '한우리 통합사회 2', title: '세계 문화·지리', href: 'DetailGeo.dc.html', head: '올바른 세계 시민 의식 기르기',\n            items: ['세계 여러 나라의 지리와 문화 이해', '통합적 사고력과 문제 해결력 향상', '초등 6학년 및 중등 사회 교과 연계'] },\n          { eyebrow: '한우리 통합사회 3', title: '세계사', href: 'DetailWorld.dc.html', head: '올바른 세계관 확립하기',\n            items: ['세계 역사의 체계적 이해', '역사의식과 문제 해결력 향상', '중등 역사 교과 대비'] }\n        ],\n        feats: [\n          ['과학 독서를 통한 과학 교과 배경지식 확장 및 과학 탐구력 향상', '과학 기초 개념을 단단하게 쌓으며 과학 교과 대비는 물론 고학년 과학 정보책 읽기 능력도 기릅니다. 나아가 미래 사회를 살아가는 데 꼭 필요한 과학적 사고 습관과 과학적 문제 해결력을 기를 수 있습니다.'],\n          ['역사 독서를 통한 올바른 가치관과 세계관 함양', '한국사와 세계사에서 중요한 인물이나 문학, 문화, 사회, 지리 등에 대해 체계적으로 독서 토론을 하면서 올바른 가치관과 세계관을 정립할 수 있습니다.'],\n          ['주제별 독서를 통한 사고력 확장', '과학, 역사, 지리·문화 등 선정된 주제의 책을 12개월 동안 꾸준히 읽으며 해당 주제에 대한 전반적인 지식의 폭을 넓히고, 이를 바탕으로 다른 분야와 연관 지어 생각하는 능력을 길러 줍니다.'],\n          ['교과 연계 수업으로 배경지식 확장', '초등 과학, 초등 사회 교과와 중학교 사회 및 역사 교과에 나오는 주제와 관련된 책 읽기를 통해 배경지식을 확장하여 수업 흥미를 높여 줍니다. 또 교육과정의 변화에 맞춘 다양한 유형의 활동을 통해 문제 해결력을 길러 줍니다.']\n        ]\n      },\n      middle: {\n        sub: '중고등정규', crumbs: '프로그램 > 중고등정규', eyebrow: '중학생 · 고등학생 · 정규 과정',\n        title: '중등부터 수능까지,\\n읽고 쓰는 힘이 성적이 됩니다',\n        desc: '소크라테스 1~3 단계로 문학·비문학 독해의 원리부터 융합까지 익히고, 고등 문학으로 교과서·수능 문학을 완성합니다.',\n        bar: '중등·고등 정규 프로그램',\n        steps: [\n          { eyebrow: '중등 소크라테스', title: '소크라테스 1', href: 'DetailSocrates.dc.html', head: '독해 원리',\n            items: ['문학/비문학 독해의 기본 원리 학습', '다양한 분야의 독서로 읽기 능력 향상', '시사이슈 토론으로 표현력 UP!'] },\n          { eyebrow: '중등 소크라테스', title: '소크라테스 2', href: 'DetailSocrates.dc.html', head: '독해 심화',\n            items: ['문학/비문학 독해의 원리 적용 학습', '다양한 분야의 독서로 분석 능력 향상', '시사이슈 토론으로 논리력 UP!'] },\n          { eyebrow: '중등 소크라테스', title: '소크라테스 3', href: 'DetailSocrates.dc.html', head: '독해 융합',\n            items: ['문학/비문학 독해의 영역 융합 훈련', '다양한 분야의 독서로 문제해결력 향상', '시사이슈 토론으로 통합적 사고력 UP!'] },\n          { eyebrow: '고등 정규', title: '고등 문학', href: 'DetailLiterature.dc.html', head: '교과서·수능 문학 완성',\n            items: ['교과서·수능 빈출 작품 갈래별 감상', '작품 해석 토론과 비평문 쓰기', '수능형 문학 문제 분석'] }\n        ],\n        feats: [\n          ['문학 독해의 원리부터 융합까지', '문학 독해의 기본 원리부터 심화, 융합까지 체계적으로 익힙니다. 이를 토대로 중학생 필독 단편소설을 분석·감상하며 추론적 사고력을 키웁니다. 어떤 문학 지문에도 자신 있는 탄탄한 독해력을 키웁니다.'],\n          ['IB 교육 방향을 접목한 지식 탐구', 'IB(국제 바칼로레아) 교육 방향을 ‘독서–토론–논술’의 기본 교육법을 기반으로 하는 한우리 중등 프로그램에 접목하여 깊이 있는 지식 탐구 활동을 합니다. 교과서와 관련된 배경지식을 확장하고 체계적인 탐구 과정을 거쳐, 탐구 질문에 대한 나만의 해결 방안을 도출하며, 논술 실력과 대안적 사고력을 키웁니다.'],\n          ['비문학 독해와 학교 평가 대비', '비문학 독해의 기본 원리부터 심화, 융합까지 체계적으로 익힙니다. 인문·사회·과학 등 다양한 계열의 독서를 통해 습득한 지식과 정보를 탐구 질문 해결에 활용하며 비판적 사고력을 기릅니다. 서·논술형 글쓰기, 수행평가 활동을 하며 학교 평가에도 대비합니다.'],\n          ['통합적 사고력과 해결책 마련', '사회의 복잡한 사회 현상을 다양한 자료를 토대로 파악하고, 다각적으로 이해하며 통합적 사고력을 기릅니다. 토의·토론, 논·구술을 통해 지속가능한 해결책을 마련합니다.']\n        ]\n      }\n    };\n    const key = groups[this.props.group] ? this.props.group : 'elementary';\n    const g = groups[key];\n    const n = g.steps.length;\n    return {\n      g, n, c: palettes[key],\n      steps: g.steps.map((s, i) => ({ ...s, no: i + 1, lift: n - 1 - i })),\n      feats: g.feats.map(([t, d], i) => ({ n: i + 1, t, d }))\n    };\n  }\n}\n"}, "Desktop": {"tpl": "\n\n<div style=\"width: 1440px; min-height: 3300px; background: #FFFFFF\">\n  <dc-import name=\"Main\" hint-size=\"1440px,3300px\"><\/dc-import>\n<\/div>\n", "css": "\n\nbody{margin:0;background:#FFFFFF}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n"}, "DetailGeo": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF\">\n  <dc-import name=\"ProgramDetail\" program=\"geo\" hint-size=\"100%,2700px\"><\/dc-import>\n<\/div>\n", "css": "\n\nbody{margin:0}\n", "code": "\nclass Component extends DCLogic {\n  renderV div style=\"width: 100%; min-height: 100vh; background: #FFFFFF\">\n  <dc-import name=\"ProgramDetail\" program=\"vocab\" hint-size=\"100%,2700px\"><\/dc-import>\n<\/div>\n", "css": "\n\nbody{margin:0}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n"}, "DetailWorld": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF\">\n  <dc-import name=\"ProgramDetail\" program=\"world\" hint-size=\"100%,2700px\"><\/dc-import>\n<\/div>\n", "css": "\n\nbody{margin:0}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n"}, "Elementary": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; display: flex; flex-direction: column\">\n  <dc-import name=\"Header\" active=\"program\" sub=\"초등정규\" crumbs=\"프로그램 &gt; 초등정규\" hint-size=\"100%,260px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"e-h\" class=\"wrap\" style=\"padding-top: 28px; display: flex; flex-direction: column; gap: 14px\">\n      <h1 id=\"e-h\" class=\"sec-h\" style=\"margin: 0; font-size: 24px; font-weight: 800\">학년별 프로그램<\/h1>\n      <ul class=\"g-sel\" style=\"margin: 0; padding: 0; list-style: none\">\n        <sc-for list=\"{{progs}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <li style=\"display: flex\">\n            <article style=\"flex: 1 1 auto; border-radius: 22px; border: 1.5px solid {{p.line}}; background: #FFFFFF; color: #1F1F1F; display: flex; flex-direction: column; overflow: hidden\">\n              <div style=\"position: relative; padding: 20px 20px 18px; background: {{p.soft}}; display: flex; flex-direction: column; gap: 10px; overflow: hidden\">\n                <span aria-hidden=\"true\" style=\"position: absolute; right: -18px; top: -18px; width: 96px; height: 96px; border-radius: 50%; background: {{p.accent}}; opacity: 0.22\"><\/span>\n 8px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #F26522\"><\/span>프로그램의 특징<\/h2>\n      <ol class=\"g-feat\" style=\"margin: 0; padding: 0; list-style: none\">\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">1<\/span><div><strong style=\"font-size: 15px\">문해력 향상 훈련<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">다양한 어휘, 문법, 요약하기, 속담, 한자성어 등 필수 국어 지식 익히기와 미시적 독해 전략 활용 활동을 합니다.<\/p><\/div><\/li>\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">2<\/span><div><strong style=\"font-size: 15px\">필독서를 통한 사고력 확장<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">읽은 책을 바탕으로 사고를 확장하여 글을 쓰고 토의·토론을 하며 주제에 대하여 더 깊이 생각해 보는 나선형 활동을 합니다.<\/p><\/div><\/li>\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">3<\/span><div><strong style=\"font-size: 15px\">사고력 발달을 위한 독서 토의·토론<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">독서한 내용에 대해 여러 차원에서 생각하고 느낌, 의견을 나눔으로써 더욱 수준 높은 독서가 되도록 능동적으로 소통합니다.<\/p><\/div><\/li>\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">4<\/span><div><strong style=\"font-size: 15px\">문제 해결력을 기르는 자기주도학습<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">어린이 스스로 문제의식을 갖고 책을 읽고 문제를 해결할 수 있도록 자기주도적 활동을 체계적으로 훈련합니다.<\/p><\/div><\/li>\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">5<\/span><div><strong style=\"font-size: 15px\">멀티미디어 활용<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">QR 코드 등의 멀티미디어를 활용하여 흥미진진하고 입체적인 독서 토의·토론 탐구 활동을 진행합니다.<\/p><\/div><\/li>\n        <li style=\"display: flex; gap: 12px; padding: 18px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF\"><span style=\"width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: #F26522; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">6<\/span><div><strong style=\"font-size: 15px\">온라인 연계 활동<\/strong><p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">어린이들이 읽는 필독서와 연계하여 책의 내용을 확인하고 이해도를 점검할 수 있는 독서 퀴즈를 매월 제공합니다.<\/p><\/div><\/li>\n      <\/ol>\n    <\/section>\n\n    <section aria-label=\"자가진단\" class=\"wrap\" style=\"padding-top: 28px; padding-bottom: 48px\">\n      <div style=\"display: flex; align-items: center; gap: 12px; padding: 18px; border-radius: 20px; background: #EAF2FF\">\n        <svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 2 ue=\"{{s.off}}\" hint-placeholder-val=\"{{true}}\">\n            <a href=\"{{s.href}}\" style=\"min-width: 0; min-height: 40px; padding: 4px 6px; box-sizing: border-box; text-align: center; line-height: 1.3; word-break: keep-all; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #FFFFFF; color: #333333; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid #ECE4DE\">{{s.label}}<\/a>\n          <\/sc-if>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n  <sc-if value=\"{{hasCrumbs}}\" hint-placeholder-val=\"{{true}}\">\n    <nav aria-label=\"현재 위치\" style=\"background: #F7F7F8; border-top: 1px solid #EFEFEF\">\n      <ol style=\"max-width: 1200px; margin: 0 auto; padding: 10px 20px; list-style: none; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6B6B; box-sizing: border-box\">\n        <li style=\"display: flex; align-items: center\"><svg role=\"img\" aria-label=\"홈\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"#8A8A8A\"><path d=\"M12 3 3 10.5V21h6v-6h6v6h6V10.5z\"><\/path><\/svg><\/li>\n        <sc-for list=\"{{crumbs}}\" as=\"c\" hint-placeholder-count=\"2\">\n          <li style=\"display: flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\">›<\/span><span style=\"font-weight: {{c.weight}}; color: {{c.color}}\">{{c.label}}<\/span><\/li>\n        <\/sc-for>\n      <\/ol>\n    <\/nav>\n  <\/sc-if>\n<\/header>\n", "css": "\n\nbody{margin:0}\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    const active = this.props.active ?? 'program';\n    const sub = this.props.sub ?? '유아정규';\n    const crumbStr = this.props.crumbs ?? '프로그램 > 유아정규';\n    const tabDefs = [\n      { key: 'program', label: '프로그램', href: 'Program.dc.html' },\n      { key: 'consult', label: '수업상담', href: 'Consult.dc.html' },\n      { key: 'center', label: '센터찾기', href: 'Centers.dc.html' },\n      { key: 'teacher', label: '한우리선생님', href: 'Teacher.dc.html' }\n    ];\n    const tabs = tabDefs.map(t => ({ ...t, on: t.key === active, off: t.key !== active }));\n    const subMap = {\n      program: [\n        ['소개', 'Program.dc.html'], ['유아정규', 'Kinder.dc.html'], ['초등정규', 'Elementary.dc.html'],\n        ['초등심화', 'Advanced.dc.html'], ['중고등정규', 'Middle.dc.html'], ['단기특강', 'Special.dc.html']\n      ],\n      teacher: [\n        ['한우리선생님', 'Teacher.dc.html'], ['교사특별반', 'TeacherSpecial.dc.html'], ['지도교사 입문과정', 'TeacherCourse.dc.html'],\n        ['온라인설명회', 'Seminar.dc.html'], ['센터모집', 'Franchise.dc.html']\n      ]\n    };\n    const subs = (subMap[active] || []).map(([label, href]) => ({ label, href, on: label === sub, off: label !== sub }));\n    const parts = crumbStr ? crumbStr.split('>').map(s => s.trim()).filter(Boolean) : [];\n    const crumbs = parts.map((label, i) => ({\n      label,\n      weight: i === parts.length - 1 ? 700 : 400,\n      color: i === parts.length - 1 ? '#1F1F1F' : '#6B6B6B'\n    }));\n    const pink = (this.props.theme ?? 'orange') === 'pink';\n    const open = !!(this.state && this.state.menu);\n    const toItems = arr => arr.map(([label, href]) => ({ label, href }));\n    const menuGroups = [\n      { label: '프로그램', href: 'Program.dc.html', items: toItems(subMap.program) },\n      { label: '수업상담', href: 'Consult.dc.html', items: [] },\n      { label: '센터찾기', href: 'Centers.dc.html', items: [] },\n      { label: '한우리선생님', href: 'Teacher.dc.html', items: toItems(subMap.teacher) }\n    ].map(g => ({ ...g, hasItems: g.items.length > 0 }));\n    return {\n      menuOpen: open, menuClosed: !open, menuExp: open ? 'true' : 'false', menuLabel: open ? '전체 메뉴 닫기' : '전체 메뉴 열기',\n      toggleMenu: () => this.setState({ menu: !open }), menuGroups,\n      tabs, subs, hasSubs: subs.length > 0, crumbs, hasCrumbs: crumbs.length > 0,\n      accent: pink ? '#EE6D9F' : '#F26522', accentText: pink ? '#B8326A' : '#D94E0F', accentFill: pink ? '#D63F7C' : '#F26522'\n    };\n  }\n}\n"}, "Kinder": {"tpl": "\n\n<div style=\" x-direction: column; gap: 10px\">\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #D6D6D6\">다른 무엇도 아닌 우리 아이들의 교육이기에,<br>빠른 길이 아닌 바른 길을 가며<\/p>\n          <h2 id=\"hist-title\" class=\"sec-h\" style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.35\"><span style=\"color: #FF8A4F\">35년간<\/span><br>올곧은 교육 철학을 지켜왔습니다<\/h2>\n        <\/div>\n        <div class=\"hist-grid\" style=\"display: flex; flex-direction: column; gap: 24px\">\n        <dl class=\"stats\" style=\"margin: 0\">\n          <div style=\"padding: 18px; border-radius: 18px; background: #2B2B2B\"><dt style=\"font-size: 13px; color: #C9C9C9\">전국 센터 수<\/dt><dd style=\"margin: 6px 0 0; font-size: 34px; font-weight: 800; color: #FF8A4F\">600개+<\/dd><\/div>\n          <div style=\"padding: 18px; border-radius: 18px; background: #2B2B2B\"><dt style=\"font-size: 13px; color: #C9C9C9\">전국 교사 수<\/dt><dd style=\"margin: 6px 0 0; font-size: 34px; font-weight: 800; color: #FF8A4F\">4,500명+<\/dd><\/div>\n          <div style=\"padding: 18px; border-radius: 18px; background: #2B2B2B\"><dt style=\"font-size: 13px; color: #C9C9C9\">한우리 회원 누적 회원 수<\/dt><dd style=\"margin: 6px 0 0; font-size: 34px; font-weight: 800; color: #FF8A4F\">2,000만+<\/dd><\/div>\n        <\/dl>\n        <div class=\"hist-chart\" style=\"display: flex; flex-direction: column; gap: 8px\">\n        <svg role=\"img\" aria-label=\"연도별 누적 회원 수 증가 추이\" viewBox=\"0 0 320 160\" style=\"width: 100%; height: auto\"><path d=\"M0 40h320M0 80h320M0 120h320\" stroke=\"#353535\" stroke-dasharray=\"3 4\"><\/path><path d=\"M0 150h320\" stroke=\"#4A4A4A\"><\/path><polygon points=\"8,150 8,138 48,134 88,130 128,126 168,116 208,100 248,78 280,52 308,16 308,150\" fill=\"#FF8A4F\" fill-opacity=\"0.14\"><\/polygon><polyline points=\"8,138 48,134 88,130 128,126 168,116 208,100 248,78 280,52 308,16\" fill=\"none\" stroke=\"#FF8A4F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/polyline><circle cx=\"308\" mbs=\"프로그램 &gt; 중고등정규\" hint-size=\"100%,260px\"><\/dc-import>\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"m-h\" style=\"background: #1F1F1F; color: #FFFFFF; border-radius: 0 0 32px 32px\">\n      <div class=\"wrap\" style=\"padding-top: 36px; padding-bottom: 36px; display: flex; flex-direction: column; gap: 14px\">\n        <span style=\"align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #F26522; font-size: 13px; font-weight: 700\">중학생 · 고등학생<\/span>\n        <h1 id=\"m-h\" class=\"hero-h\" style=\"margin: 0; font-size: 28px; font-weight: 800; line-height: 1.35\">중등부터 수능까지,<br><span style=\"color: #FF8A4F\">읽고 쓰는 힘<\/span>이 성적이 됩니다<\/h1>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.7; color: #D6D6D6\">교과서 수록 작품과 비문학 독해, 서술형·수행평가와 논술까지. 학년별 교과 과정에 맞춘 한우리 중고등 커리큘럼입니다.<\/p>\n        <div style=\"height: 170px; border-radius: 20px; background: #2B2B2B; border: 1px dashed #555555; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #BDBDBD\">[이미지] 토론 수업 중인 중학생들<\/div>\n      <\/div>\n    <\/section>\n\n    <section aria-labelledby=\"m-course\" class=\"wrap\" style=\"padding-top: 44px; display: flex; flex-direction: column; gap: 14px\">\n      <h2 id=\"m-course\" class=\"sec-h\" style=\"margin: 0; font-size: 22px; font-weight: 800\">과정 안내<\/h2>\n      <div class=\"g2c\">\n        <article style=\"padding: 22px 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"align-self: flex-start; padding: 4px 8px; border-radius: 6px; background: #FFF1E7; color: #C2410C; font-size: 12px; font-weight: 700\">중1 ~ 중3<\/span>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 800\">중등정규<\/h3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A4A\">교과서 문학·비문학을 깊이 읽고, 서술형과 수행평가에 강한 글쓰기 실력을 기릅니다.<\/p>\n          <ul style=\"margin: 0; padding: 14px; list-style: none; border-radius: 14px; background: #F7F7F8; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #333333\">\n            <li>· 교과서 수록 작품 깊이 읽기<\/li><li>· 비문학 구조 독해 훈련<\/li><li>· 서술형·수행평가 실전 쓰기<\/li>\n          <\/ul>\n        <\/article>\n        <article style=\"padding: 22px 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"align-self: flex-start; padding: 4px 8px; border-radius: 6px; background: #EAF2FF; color: #2F5AA8; font-size: 12px; font-weight: 700\">고1 ~ 고2<\/span>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 800\">고등정규<\/h3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A4A\">수능 독서 영역과 통합 교과 주제를 바탕으로 논리적 사고와 논술·면접 역량을 완성합니다.<\/p>\n          <ul style=\"margin: 0; padding: 14px; list-style: none; border-radius: 14px; background: #F7F7F8; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #333333\">\n            <li>· 수능 독서 지문 분석<\/li><li>· 통합 교과 주제 토론<\/li><li>· 대입 논술·면접 기초<\/li>\n          <\/ul>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <section aria-labelledby=\"m-feat\" style=\"margin-top: 48px; background: #FFF7F1; padding: 40px 0\">\n      <div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h2 id=\"m-feat\" class=\"sec-h\" style=\"margin: 0; font-size: 22px; font-weight: 800; text-align: center\">중고등 수업의 특징<\/h2>\n        <div class=\"g3\">\n          <div style=\"padding: 20px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-size: 28px; font-weight: 800; color: #F26522\">01<\/span><strong style=\"font-size: 16px\">교과 연계 필독서<\/strong><p style=\"margin: 0; font-size: 13px; line-height: 1.6; color: #4A4A4A\">학년별 국어·사회·과학 교과와 연계된 도서를 매월 선정합니다.<\/p><\/div>\n          <div style=\"padding: 20px; border-radius: 20px; background: #FFFFF >\n  <main style=\"flex: 1 0 auto\">\n    <section aria-labelledby=\"feat\" style=\"background: #FFF7F1; padding: 36px 0 40px\">\n      <div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px\">\n        <h1 id=\"feat\" class=\"sec-h\" style=\"margin: 0; text-align: center; font-size: 24px; font-weight: 800\">한우리 프로그램 특징<\/h1>\n        <div class=\"g1-3\">\n          <article style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EEEEEE\">\n            <span style=\"width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; background: #FFF1E7; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D94E0F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z\"><\/path><path d=\"M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z\"><\/path><\/svg><\/span>\n            <div><h2 style=\"margin: 0 0 4px; font-size: 17px; font-weight: 700\">학년별 교과 연계<\/h2><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A4A\">학년별 교과 주제를 이해하여 학습 역량을 향상시킬 수 있습니다.<\/p><\/div>\n          <\/article>\n          <article style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EEEEEE\">\n            <span style=\"width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; background: #FFF6DA; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B45309\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\/path><path d=\"M14 2v6h6M9 15l2 2 4-4\"><\/path><\/svg><\/span>\n            <div><h2 style=\"margin: 0 0 4px; font-size: 17px; font-weight: 700\">최신 평가 유형 반영<\/h2><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A4A\">최신 서술형 및 수행평가 유형을 반영하여 빠르게 대비할 수 있습니다.<\/p><\/div>\n          <\/article>\n          <article style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EEEEEE\">\n            <span style=\"width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; background: #EAF2FF; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2F5AA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\/rect><path d=\"M16 2v4M8 2v4M3 10h18\"><\/path><\/svg><\/span>\n            <div><h2 style=\"margin: 0 0 4px; font-size: 17px; font-weight: 700\">매달 새로운 교재<\/h2><p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #4A4A4A\">매달 새롭게 개정되는 교재로 다양한 독서를 할 수 있습니다.<\/p><\/div>\n          <\/article>\n        <\/div>\n        <a href=\"#how\" style=\"height: 52px; border-radius: 14px; border: 1.5px solid #F26522; background: #FFFFFF; color: #C2410C; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none\">프로그램 한눈에 보기 ⌄<\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"how\" aria-labelledby=\"how-h\" class=\"wrap\" style=\"padding-top: 48px; display: flex; flex-direction: column; gap: 14px\">\n      <h2 id=\"how-h\" class=\"sec-h\" style=\"margin: 0; font-size: 22px; font-weight: 800\">한우리 수업, 어떻게 진행되나요?<\/h2>\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.7; color: #4A4A4A\">한 달 4차시 수업에서 매달 새로운 필독서와 매달 바뀌는 교재로 수업합니다. 수업은 읽기·말하기·듣기·쓰기·생각하기 영역을 고르게 활용하는 다양한 활동으로 구성됩니다.<\/p>\n      <ol class=\"g2-4\" style=\"margin: 4px 0 0; padding: 0; list-style: none\">\n        <li style=\"padding: 18px 12px; border-radius: 16px; background: #FFF7F1; lass Component extends DCLogic {\n  renderVals() {\n    const G = {\n      elementary: { sub: '초등정규', back: 'Elementary.dc.html' },\n      advanced: { sub: '초등심화', back: 'Advanced.dc.html' },\n      middle: { sub: '중고등정규', back: 'Middle.dc.html' }\n    };\n    const P = [\n      { id: 'vocab', group: 'elementary', href: 'DetailVocab.dc.html', title: '어휘리더', grade: '초등 1·2학년', focus: '★ 어휘력·기초 문해력', tint: '#FFF4EC', img: '그림책을 읽으며 어휘 카드를 고르는 아이',\n        slogan: '책 읽기의 즐거움과 교과 기초 어휘·표현력 다지기', tags: '#그림책  #교과기초어휘  #초등입학적응',\n        long: '그림책과 저학년 문학을 깊이 읽으며 교과서에 나오는 기초 어휘와 표현을 익히고, 자기 생각을 짧은 글로 표현하는 습관을 만듭니다.',\n        points: ['교과서 필수 어휘를 그림책 속 문맥으로 익혀요', '읽은 내용을 자기 말로 표현하는 습관이 생겨요', '초등 입학 후 국어 수업에 자신감이 붙어요'], steps: ['어휘 놀이터', '그림책 깊이 읽기', '교과 연계 읽기', '생각 표현 쓰기'] },\n      { id: 'reading', group: 'elementary', href: 'DetailReading.dc.html', title: '독서리더', grade: '초등 3·4학년', focus: '교과 독서·생각의 확장', tint: '#EEF4FF', img: '교과 연계 도서를 읽고 토론하는 아이들',\n        slogan: '과목별 심화 배경지식 확장 및 갈래별 글쓰기 기초 훈련', tags: '#교과연계  #갈래별글쓰기  #배경지식',\n        long: '국어·사회·과학 교과와 연계된 도서로 배경지식을 넓히고, 설명문·감상문·논설문 등 갈래별 글쓰기의 기초를 단단히 다집니다.',\n        points: ['교과 단원과 연결된 배경지식이 넓어져요', '설명문·감상문·논설문을 구분해 쓸 수 있어요', '토의·토론으로 생각을 말로 정리해요'], steps: ['읽기·쓰기', '교과 읽기', '토의·토론', '문학 읽기'] },\n      { id: 'logic', group: 'elementary', href: 'DetailLogic.dc.html', title: '논리리더', grade: '초등 5·6학년', focus: '논리적 토론·중등 대비', tint: '#FFF8E1', img: '찬반 토론 수업 장면',\n        slogan: '비판적 미디어 읽기, 실전 찬반토론 및 중등 서술형 완벽 대비', tags: '#찬반토론  #미디어리터러시  #중등논술대비',\n        long: '비문학과 미디어 텍스트를 비판적으로 읽고, 근거를 갖춘 찬반 토론과 논술 쓰기로 중학교 서술형·수행평가를 준비합니다.',\n        points: ['뉴스·광고 등 미디어를 비판적으로 읽어요', '근거를 들어 주장하는 찬반 토론에 익숙해져요', '중학교 서술형·수행평가를 미리 준비해요'], steps: ['비문학 독해', '미디어 읽기', '찬반 토론', '논술 쓰기'] },\n      { id: 'science', group: 'advanced', href: 'DetailScience.dc.html', title: '과학탐탐', grade: '초등 3~6학년', focus: '과학 탐구', tint: '#E9F6EE', img: '실험 관찰 노트를 쓰는 아이',\n        slogan: '궁금증을 탐구로, 탐구를 글로', tags: '#과학교과  #탐구보고서  #실험관찰',\n ; border-radius: 6px; background: {{s.chipBg}}; color: {{s.chipFg}}; font-size: 12px; font-weight: 700\">{{s.status}}<\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <label for=\"se-name\" style=\"font-size: 13px; font-weight: 600; color: #333333\">이름<\/label>\n          <input id=\"se-name\" type=\"text\" autocomplete=\"name\" placeholder=\"이름을 입력해 주세요\" style=\"height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #F7F7F8; padding: 0 16px; font-family: inherit; font-size: 16px; box-sizing: border-box; width: 100%\">\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <label for=\"se-phone\" style=\"font-size: 13px; font-weight: 600; color: #333333\">휴대폰 번호 (접속 링크 발송)<\/label>\n          <input id=\"se-phone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"010-0000-0000\" style=\"height: 52px; border-radius: 12px; border: 1px solid #E4E4E4; background: #F7F7F8; padding: 0 16px; font-family: inherit; font-size: 16px; box-sizing: border-box; width: 100%\">\n        <\/div>\n        <label style=\"display: flex; gap: 10px; align-items: center; font-size: 14px\"><input type=\"checkbox\" style=\"width: 22px; height: 22px; margin: 0; accent-color: #F26522\">[필수] 개인정보 수집 및 이용 동의<\/label>\n        <button type=\"button\" onClick=\"{{submit}}\" style=\"height: 56px; border: 0; border-radius: 14px; background: #F26522; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">{{selLabel}} 설명회 신청하기<\/button>\n        <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\"><p aria-live=\"polite\" style=\"margin: 0; padding: 14px 16px; border-radius: 14px; background: #E8F5EE; color: #1F5F3C; font-size: 14px; font-weight: 600; line-height: 1.5\">✓ {{selLabel}} 설명회 신청이 완료되었습니다. 접속 링크를 문자로 보내드립니다.<\/p><\/sc-if>\n      <\/form>\n    <\/div>\n  <\/main>\n  <dc-import name=\"Footer\" hint-size=\"100%,340px\"><\/dc-import>\n  <div class=\"sticky-b\"><dc-import name=\"BottomNav\" cta=\"온라인 설명회 신청하기\" cta-href=\"Seminar.dc.html\" show-center=\"{{false}}\" hint-size=\"100%,84px\"><\/dc-import><\/div>\n<\/div>\n", "css": "\n\nbody{margin:0;background:#FFFFFF}\na{color:#C2410C}a:hover{color:#9A3412}\ninput::placeholder{color:#8A8A8A}\n.wrap{max-width:1200px;margin:0 auto;padding-left:20px;padding-right:20px;box-sizing:border-box}\n.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}\n.sticky-b{position:sticky;bottom:0;z-index:20}\n@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}.hero-h{font-size:40px !important}}\n", "code": "\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { sel: 1 }; }\n  renderVals() {\n    const defs = [\n      { date: '[MM.DD] (화)', time: '오전 10:30 - 11:10', status: '마감', full: true },\n      { date: '[MM.DD] (목)', time: '오전 10:30 - 11:10', status: '신청 가능', full: false },\n      { date: '[MM.DD] (토)', time: '오후 8:00 - 8:40', status: '마감 임박', full: false }\n    ];\n    const sessions = defs.map((d, i) => {\n      const on = i === this.state.sel;\n      return {\n        ...d, sel: on ? 'true' : 'false',\n        bg: d.full ? '#F4F4F5' : (on ? '#FFF4EC' : '#FFFFFF'),\n        border: on ? '2px solid #F26522' : '1px solid #E4E4E4',\n        chipBg: d.full ? '#E4E4E4' : (d.status === '마감 임박' ? '#FDECEC' : '#E8F5EE'),\n        chipFg: d.full ? '#4A4A4A' : (d.status === '마감 임박' ? '#B42318' : '#1F7A4C'),\n        pick: () => { if (!d.full) this.setState({ sel: i }); }\n      };\n    });\n    return { sessions, selLabel: defs[this.state.sel].date, done: !!this.state.done, submit: () => this.setState({ done: true }) };\n  }\n}\n"}, "Special": {"tpl": "\n\n<div style=\"width: 100%; min-height: 100vh; background: #FFFFFF; font-family: 'Pretendard', system-ui, sans-serif; color: #1F1F1F; letter-spacing: -0.02em; d   function getClass(name) {

      classes[name] = new Function('DCLogic', FILES[name].code + '\n;return Component;')(DCLogic);
    }
    return classes[name];
  }

  var tpls = {};
  function tplOf(name) {
    if (!tpls[name]) {
      var t = document.createElement('template');
      t.innerHTML = FILES[name].tpl;
      tpls[name] = t.content;
    }
    return tpls[name];
  }

  var instances = new Map();
  var usedCss = [];
  function instFor(key, name, props) {
    var inst = instances.get(key);
    if (!inst || inst.__name !== name) {
      var C = getClass(name);
      inst = new C(props);
      inst.__name = name;
      if (!inst.state) inst.state = {};
      instances.set(key, inst);
    } else {
      inst.props = props;
    }
    return inst;
  }

  function lookup(expr, scope) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return +expr;
    if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
    var v = scope;
    var parts = expr.split('.');
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(s, scope) {
    return s.replace(ANY, function (m, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  function camel(s) { return s.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); }); }

  function renderComp(name, props, key, out) {
    if (usedCss.indexOf(name) < 0) usedCss.push(name);
    var inst = instFor(key, name, props);
    var vals = inst.renderVals ? inst.renderVals() : {};
    renderChildren(tplOf(name), Object.assign({}, vals), out, key);
  }
  function renderChildren(src, scope, out, key) {
    var kids = src.childNodes;
    for (var i = 0; i < kids.length; i++) renderNode(kids[i], scope, out, key + '.' + i);
  }
  function holeOrText(val, scope) {
    var m = val.match(WHOLE);
    if (m) return lookup(m[1], scope);
    return val.indexOf('{{') >= 0 ? interp(val, scope) : val;
  }
  function renderNode(n, scope, out, key) {
    if (n.nodeType === 3) {
      out.appendChild(document.createTextNode(n.nodeValue.indexOf('{{') >= 0 ? interp(n.nodeValue, scope) : n.nodeValue));
      return;
    }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    if (tag === 'helmet') return;
    if (tag === 'sc-if') {
      if (holeOrText(n.getAttribute('value') || '', scope)) renderChildren(n, scope, out, key);
      return;
    }
    if (tag === 'sc-for') {
      var list = holeOrText(n.getAttribute('list') || '', scope) || [];
      var as = n.getAttribute('as') || 'item';
      for (var idx = 0; idx < list.length; idx++) {
        var s = Object.assign({}, scope);
        s[as] = list[idx];
        s.$index = idx;
        renderChildren(n, s, out, key + '[' + idx + ']');
      }
      return;
    }
    if (tag === 'dc-import') {
      var props = {}, cname = null;
      for (var a = 0; a < n.attributes.length; a++) {
        var at = n.attributes[a];
        if (at.name === 'name') { cname = at.value; continue; }
        if (at.name.indexOf('hint-') === 0) continue;
        props[camel(at.name)] = holeOrText(at.value, scope);
      }
      if (cname && FILES[cname]) renderComp(cname, props, key + '>' + cname, out);
      return;
    }
    var el = n.namespaceURI === SVG_NS ? document.createElementNS(SVG_NS, n.localName) : document.createElement(tag);
    for (var b = 0; b < n.attributes.length; b++) {
      var attr = n.attributes[b], nm = attr.name;
      if (nm.indexOf('hint-') === 0) continue;
      if (/^on[a-z]+$/.test(nm)) {
        var fn = holeOrText(attr.value, scope);
        if (typeof fn === 'function') {
          (function (f) { el.addEventListener(nm.slice(2), function (e) { f(e); }); })(fn);
        }
        continue;
      }
      var v = holeOrText(attr.value, scope);
      if (nm === 'checked') { el.checked = !!v; if (v) el.setAttribute('checked', ''); continue; }
      if (v === false || v == null) continue;
      el.setAttribute(nm, v === true ? '' : String(v));
    }
    renderChildren(n, scope, el, key);
    out.appendChild(el);
  }

  var current = START;
  var styleEl = document.getElementById('page-css');
  var app = document.getElementById('app');

  function saveInputs() {
    return Array.prototype.map.call(app.querySelectorAll('input,textarea,select'), function (e) {
      return e.type === 'checkbox' || e.type === 'radio' ? null : e.value;
    });
  }
  function restoreInputs(vals) {
    var els = app.querySelectorAll('input,textarea,select');
    if (els.length !== vals.length) return;
    for (var i = 0; i < els.length; i++) if (vals[i] != null) els[i].value = vals[i];
  }

  function render() {
    var saved = saveInputs();
    usedCss = [];
    var frag = document.createDocumentFragment();
    try {
      renderComp(current, {}, 'root', frag);
    } catch (err) {
      console.error(err);
    }
    styleEl.textContent = usedCss.map(function (n) { return FILES[n].css; }).join('\n');
    app.replaceChildren(frag);
    restoreInputs(saved);
    markNav();
  }

  function routeFromHash() {
    var m = location.hash.match(/^#\/([A-Za-z0-9_-]+)/);
    return m && FILES[m[1]] ? m[1] : START;
  }
  function go(name) {
    if (!FILES[name]) return;
    if (location.hash !== '#/' + name) location.hash = '#/' + name;
    else show(name);
  }
  function show(name) {
    current = name;
    instances = new Map();
    render();
    window.scrollTo(0, 0);
    var t = PAGES.filter(function (p) { return p.name === name; })[0];
    document.title = (t ? t.title + ' · ' : '') + '한우리독서토론논술 프로토타입';
  }
  window.addEventListener('hashchange', function () { show(routeFromHash()); });

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || !app.contains(a)) return;
    var href = a.getAttribute('href');
    var page = href.match(/^\/?([A-Za-z0-9_-]+)\.dc\.html(#.*)?$/);
    if (page) { e.preventDefault(); go(page[1]); return; }
    if (href === '#') { e.preventDefault(); return; }
    if (href.charAt(0) === '#') {
      e.preventDefault();
      var id = href.slice(1);
      setTimeout(function () {
        var t = document.getElementById(id);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }
  });

  var nav = document.getElementById('proto-nav');
  var list = document.getElementById('proto-list');
  PAGES.forEach(function (p) {
    var a = document.createElement('a');
    a.href = '#/' + p.name;
    a.textContent = p.title;
    a.dataset.name = p.name;
    a.addEventListener('click', function () { nav.classList.remove('open'); });
    list.appendChild(a);
  });
  function markNav() {
    Array.prototype.forEach.call(list.children, function (a) {
      a.classList.toggle('cur', a.dataset.name === current);
      if (a.dataset.name === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  document.getElementById('proto-nav-btn').addEventListener('click', function () { nav.classList.add('open'); });
  nav.querySelector('.close').addEventListener('click', function () { nav.classList.remove('open'); });
  nav.addEventListener('click', function (e) { if (e.target === nav) nav.classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') nav.classList.remove('open'); });

  show(routeFromHash());
})();

</script>
</body>
</html>
